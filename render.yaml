# Render Blueprint: one Docker web service (website + API). The PostgreSQL database is hosted on Neon
# (free, does not expire); its connection URL is pasted into DATABASE_URL. Step-by-step guide: docs/deploy.md
services:
  - type: web
    name: cinematch
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false      # deploy by hand (Manual Deploy): every build spends free build minutes and every start wakes the app
    envVars:
      - key: DATABASE_URL
        sync: false        # Render asks for it: the Neon connection URL (see docs/deploy.md)
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        sync: false        # Render asks for it: the site address, e.g. https://cinematch.onrender.com
      - key: ADMIN_EMAILS
        sync: false        # your FlickRaven account email: it may open the private /stats page
      - key: GEMINI_API_KEY
        sync: false        # Google AI Studio key for the Ask FlickRaven assistant; leave empty to switch it off
      - key: ARTIFACT_BUNDLE_URL
        sync: false        # private download address of artifacts.tar.gz (docs/deploy.md); empty = from the database
      - key: ARTIFACT_BUNDLE_TOKEN
        sync: false        # read-only token for that private repository
