# Part D "Hollywood enrichment" (approved by Aryav 2026-10-08).
# A film is a candidate when 'US' is among its TMDB production countries (co-productions count).
# It is added when it is not already in parts A, B or C, passes the metadata gate, is released,
# and meets ONE of these rules (no minimum vote average: famous bad blockbusters still count):
hollywood:
  min_vote_count: 2000              # any year
  classic_before_year: 1990
  classic_min_vote_count: 1000      # released before 1990
  collection_min_vote_count: 1000   # part of a TMDB collection (franchise)
  pool_min_vote_count: 1000         # discover pool floor (the lowest rule above)
# Franchise rule (approved by Aryav 2026-10-08): a missing part of a TMDB collection that already has a
# film in the catalog is added as part D when it is released, passes the metadata gate and has at least
# min_vote_count TMDB votes (keeps out shorts and obscure direct-to-video spin-offs). pipeline/franchises.py
franchise:
  min_vote_count: 200
  min_runtime_min: 60
# Monthly new releases (approved by Aryav 2026-11-04): films released in the last lookback_months, found per
# language through TMDB discover, are added as part C ("new & notable") when they pass the metadata gate.
# Like the franchise rule they sit outside the evaluation universe (no MovieLens ratings), so models and
# results do not change; they are recommended through content similarity. pipeline/new_releases.py
new_releases:
  lookback_months: 6
  min_votes: 100                    # English and the larger languages
  min_votes_low_volume: 20          # part_b low_volume_languages and the boost languages (ta, te, ml, kn)
  max_per_language: 40              # newest month's most-voted films per language
  min_runtime_min: 60

watch_providers:                    # where to watch (TMDB watch/providers; data by JustWatch)
  region: IN                        # shown first
  fallback_region: US               # used for a film only when TMDB lists no service in `region`

# Wider catalog (approved by Aryav 2026-11-09: "all three"). Well-known films found through TMDB discover
# that the catalog does not have yet are added as part D when they pass the metadata gate and are released.
# Like the franchise rule and new releases they have no MovieLens ratings, so they sit outside the evaluation
# universe (models and results do not change) and are recommended through content similarity.
# pipeline/widen_catalog.py
widen:
  min_runtime_min: 60
  groups:
    indian:                         # Hindi and the South / regional languages
      languages: {hi: 20, ta: 20, te: 20, ml: 20, kn: 10, bn: 10, mr: 10}   # language: min TMDB votes
      max_per_language: 1500
    hollywood:                      # US productions, any year
      origin_country: US
      min_votes: 1000
      max: 5000
    korean_japanese:
      languages: {ko: 50, ja: 50}
      max_per_language: 1500
    everything_else:                # any language, so users rarely search for a film we lack. Split by release
      min_votes: 100                # period because one TMDB discover query returns at most 10,000 films
      max_per_period: 4000
      periods: [[1900, 1979], [1980, 1989], [1990, 1999], [2000, 2004], [2005, 2009], [2010, 2014],
                [2015, 2019], [2020, 2022], [2023, 2026]]

# TV series and anime (approved by Aryav 2026-11-10). Found through TMDB discover/tv and stored with
# tmdb_id = 10,000,000 + TV id (pipeline/series.py). No ratings exist for them, so they stay outside the
# evaluation universe and are recommended through content similarity and TMDB popularity only.
series:
  max: 6000                         # per discover query (TMDB returns at most 10,000)
  min_votes: 100                    # any language
  anime_min_votes: 30               # Japanese animation
  languages: {hi: 5, ta: 5, te: 5, ml: 5, kn: 5, bn: 5, mr: 5, ko: 30}   # language: min TMDB votes
